<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像フォルダ → PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #1a1a2e;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    #drop-zone {
      width: min(480px, 100%);
      border: 2.5px dashed #b0b8c8;
      border-radius: 16px;
      padding: 3.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
      user-select: none;
    }

    #drop-zone.drag-over {
      border-color: #4f6ef7;
      background: #f0f3ff;
      transform: scale(1.01);
    }

    #drop-zone .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }

    #drop-zone p {
      color: #555;
      font-size: 1rem;
      line-height: 1.6;
    }

    #drop-zone .hint {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 0.5rem;
    }

    #file-input {
      display: none;
    }
    #images-input { display: none; }
    #choose-images { margin-top: 1rem; padding: .55rem 1rem; border: 1px solid #b7c4d2; border-radius: 9px; color: #294f77; background: #f7faff; cursor: pointer; }
    #choose-images:hover { background: #e9f2ff; }

    #status {
      width: min(480px, 100%);
      margin-top: 1.5rem;
      display: none;
    }

    .file-list {
      background: #fff;
      border-radius: 12px;
      padding: 1rem 1.2rem;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #e8eaf0;
      margin-bottom: 1rem;
    }

    .file-list-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 0.6rem;
    }

    .file-item {
      font-size: 0.85rem;
      color: #333;
      padding: 0.25rem 0;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-item:last-child { border-bottom: none; }

    .file-count {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 0.8rem;
      text-align: right;
    }

    #progress-wrap {
      display: none;
      margin-bottom: 1rem;
    }

    progress {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      appearance: none;
      overflow: hidden;
    }

    progress::-webkit-progress-bar { background: #e8eaf0; border-radius: 999px; }
    progress::-webkit-progress-value { background: #4f6ef7; border-radius: 999px; transition: width 0.1s; }

    .progress-label {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.4rem;
      text-align: center;
    }

    #btn-generate {
      width: 100%;
      padding: 0.85rem;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #btn-generate:hover { background: #3a58e0; }
    #btn-generate:active { transform: scale(0.98); }
    #btn-generate:disabled { background: #b0b8c8; cursor: not-allowed; transform: none; }

    #btn-compress {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.85rem;
      background: #0ca678;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #btn-compress:hover { background: #099268; }
    #btn-compress:active { transform: scale(0.98); }
    #btn-compress:disabled { background: #b0b8c8; cursor: not-allowed; transform: none; }

    #btn-reset {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.6rem;
      background: transparent;
      color: #888;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    #btn-reset:hover { color: #444; border-color: #aaa; }

    .error-msg {
      color: #e05252;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 0.5rem;
    }
  </style>
  <link rel="stylesheet" href="../tool-common.css">
</head>
<body class="conversion-tool">
  <a class="hub-nav" href="../../">← ToolsHub</a>
  <h1>画像フォルダ → PDF / 圧縮</h1>
  <p class="subtitle">画像を自然順にまとめてPDF化。JPEG圧縮ZIPも作れます（ファイルは端末内で処理）。</p>

  <div id="drop-zone" role="button" tabindex="0" aria-label="画像フォルダを選択">
    <span class="icon">🗂️</span>
    <p>フォルダをドロップ、またはクリックして選択</p>
    <p class="hint">対応形式: JPG · PNG · GIF（先頭フレーム）· WebP · BMP</p>
    <input type="file" id="file-input" webkitdirectory multiple accept="image/*">
    <button type="button" id="choose-images">画像ファイルを複数選ぶ</button>
    <input type="file" id="images-input" multiple accept="image/jpeg,image/png,image/gif,image/webp,image/bmp">
  </div>

  <div id="status">
    <div class="file-list">
      <div class="file-list-title">検出した画像</div>
      <div id="file-items"></div>
    </div>
    <div class="file-count" id="file-count"></div>
    <div id="progress-wrap">
      <progress id="progress" value="0" max="100"></progress>
      <div class="progress-label" id="progress-label">処理中...</div>
    </div>
    <button id="btn-generate">PDFを生成してダウンロード</button>
    <button id="btn-compress">画像をZIPにまとめる（JPEGは小さくなる場合のみ再圧縮）</button>
    <button id="btn-reset">リセット</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <script>
    const SUPPORTED = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/bmp'];
    const SUPPORTED_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'];

    function isSupportedImage(file) {
      if (file.type && SUPPORTED.includes(file.type)) return true;
      const ext = file.name.split('.').pop().toLowerCase();
      return SUPPORTED_EXT.includes(ext);
    }
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const imagesInput = document.getElementById('images-input');
    const chooseImages = document.getElementById('choose-images');
    const statusEl = document.getElementById('status');
    const fileItemsEl = document.getElementById('file-items');
    const fileCountEl = document.getElementById('file-count');
    const progressWrap = document.getElementById('progress-wrap');
    const progressEl = document.getElementById('progress');
    const progressLabel = document.getElementById('progress-label');
    const btnGenerate = document.getElementById('btn-generate');
    const btnCompress = document.getElementById('btn-compress');
    const btnReset = document.getElementById('btn-reset');
    const errorMsg = document.getElementById('error-msg');

    let imageFiles = [];
    let folderName = '';

    dropZone.addEventListener('click', e => {
      if (e.target !== chooseImages && e.target !== fileInput && e.target !== imagesInput) fileInput.click();
    });
    dropZone.addEventListener('keydown', e => {
      if (e.target === dropZone && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); fileInput.click(); }
    });
    chooseImages.addEventListener('click', e => { e.stopPropagation(); imagesInput.click(); });
    imagesInput.addEventListener('change', () => {
      folderName = '';
      skippedCount = 0;
      setFiles(Array.from(imagesInput.files));
    });

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));

    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const items = e.dataTransfer.items;
      // entries は drop イベント中に同期取得する必要がある
      const entries = [];
      if (items) {
        for (const item of items) {
          const entry = item.webkitGetAsEntry?.();
          if (entry) entries.push(entry);
        }
      }

      skippedCount = 0;
      if (entries.length) {
        // ドロップされた最上位ディレクトリ名をPDF名に使う
        const dir = entries.find(en => en.isDirectory);
        folderName = dir ? dir.name : '';
        collectFromEntries(entries).catch(err => dropZoneError('フォルダを読み取れません: ' + err.message));
      } else {
        // フォルダ走査が使えない環境向けのフォールバック
        folderName = '';
        const files = Array.from(e.dataTransfer.files || []).filter(isSupportedImage);
        setFiles(files);
      }
    });

    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files).filter(isSupportedImage);
      // webkitRelativePath の先頭セグメントが選択フォルダ名
      const rel = files[0]?.webkitRelativePath || '';
      folderName = rel.includes('/') ? rel.split('/')[0] : '';
      setFiles(files);
    });

    async function collectFromEntries(entries) {
      const files = [];
      for (const entry of entries) {
        await traverseEntry(entry, files);
      }
      setFiles(files);
    }

    let skippedCount = 0;

    function traverseEntry(entry, files) {
      return new Promise(resolve => {
        if (entry.isFile) {
          // エラーコールバックを必ず渡す（iCloud等のクラウド専用ファイルで
          // 成功コールバックが発火せずハングするのを防ぐ）
          entry.file(
            file => {
              if (isSupportedImage(file)) files.push(file);
              resolve();
            },
            err => {
              console.warn('file() failed:', entry.name, err);
              skippedCount++;
              resolve();
            }
          );
        } else if (entry.isDirectory) {
          const reader = entry.createReader();
          const readAll = (cb) => {
            reader.readEntries(
              async results => {
                if (!results.length) { cb(); return; }
                for (const e of results) await traverseEntry(e, files);
                readAll(cb);
              },
              err => {
                console.warn('readEntries failed:', entry.name, err);
                cb();
              }
            );
          };
          readAll(resolve);
        } else {
          resolve();
        }
      });
    }

    function naturalCompare(a, b) {
      return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
    }

    function setFiles(files) {
      imageFiles = files.filter(isSupportedImage).sort(naturalCompare);
      if (!imageFiles.length) {
        // ドロップゾーンを表示したままエラーを出す（statusは非表示のため）
        dropZone.style.display = '';
        statusEl.style.display = 'none';
        const extra = skippedCount
          ? `（${skippedCount} 件のファイルは読み取れませんでした。iCloud等でクラウド上のみの可能性があります）`
          : '';
        dropZoneError(`対応画像が見つかりませんでした。${extra}`);
        skippedCount = 0;
        return;
      }
      errorMsg.textContent = '';
      fileItemsEl.replaceChildren(...imageFiles.map(file => {
        const row = document.createElement('div');
        row.className = 'file-item';
        row.textContent = file.webkitRelativePath || file.name;
        return row;
      }));
      fileCountEl.textContent = skippedCount
        ? `${imageFiles.length} 枚の画像（${skippedCount} 件を読み取り不可でスキップ）`
        : `${imageFiles.length} 枚の画像`;
      skippedCount = 0;
      dropZone.style.display = 'none';
      statusEl.style.display = 'block';
      progressWrap.style.display = 'none';
    }

    function dropZoneError(msg) {
      let el = document.getElementById('dz-error');
      if (!el) {
        el = document.createElement('div');
        el.id = 'dz-error';
        el.className = 'error-msg';
        el.style.marginTop = '1rem';
        dropZone.after(el);
      }
      el.textContent = msg;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
    }

    btnReset.addEventListener('click', () => {
      imageFiles = [];
      fileInput.value = '';
      imagesInput.value = '';
      dropZone.style.display = '';
      statusEl.style.display = 'none';
      errorMsg.textContent = '';
      btnGenerate.disabled = false;
      btnCompress.disabled = false;
      document.getElementById('dz-error')?.remove();
    });

    // JPEGのみ再エンコードする。PNG/GIF/WebP/BMPは透明度やアニメーションを保つため原本を維持。
    const JPEG_QUALITY = 0.88;
    const PX_TO_PT = 72 / 96;   // 96dpi のピクセルを PDF のポイント(1/72inch)へ変換

    function setBusy(busy) {
      btnGenerate.disabled = busy;
      btnCompress.disabled = busy;
      btnReset.disabled = busy;
    }

    function safeBaseName() {
      return (folderName || 'images').replace(/[\\/:*?"<>|]/g, '_').trim() || 'images';
    }

    // ── PDF生成（圧縮なし：元画像をそのまま埋め込む） ──────────────
    btnGenerate.addEventListener('click', async () => {
      if (!imageFiles.length) return;
      setBusy(true);
      progressWrap.style.display = 'block';
      errorMsg.textContent = '';

      try {
        if (!window.jspdf?.jsPDF) throw new Error('PDFライブラリを読み込めません。通信状態を確認してください。');
        const { jsPDF } = window.jspdf;
        let pdf = null;

        for (let i = 0; i < imageFiles.length; i++) {
          const file = imageFiles[i];
          progressLabel.textContent = `処理中 ${i + 1} / ${imageFiles.length}：${file.name}`;
          progressEl.value = Math.round((i / imageFiles.length) * 100);

          const dataUrl = await readAsDataURL(file);
          const img = await loadImage(dataUrl);
          const w = img.naturalWidth, h = img.naturalHeight;

          // ページは画像の縦横比そのまま（A4固定・余白なし）。元解像度を維持
          const pw = w * PX_TO_PT, ph = h * PX_TO_PT;
          const orientation = pw >= ph ? 'landscape' : 'portrait';

          if (i === 0) {
            pdf = new jsPDF({ unit: 'pt', compress: true, format: [pw, ph], orientation });
          } else {
            pdf.addPage([pw, ph], orientation);
          }
          // jsPDFが直接扱えないGIF/WebP/BMPはcanvasでPNGに変換する。
          const direct = /^image\/(jpeg|png)$/.test(file.type) || /\.(jpe?g|png)$/i.test(file.name);
          const imageData = direct ? dataUrl : imageToPng(img);
          const fmt = /^data:image\/png/i.test(imageData) ? 'PNG' : 'JPEG';
          pdf.addImage(imageData, fmt, 0, 0, pw, ph, undefined, 'FAST');
        }

        progressEl.value = 100;
        progressLabel.textContent = '完了！ダウンロードを開始します…';
        pdf.save(safeBaseName() + '.pdf');
      } catch (err) {
        showError('PDF生成中にエラーが発生しました: ' + err.message);
        console.error(err);
      } finally {
        setBusy(false);
      }
    });

    // ── 画像圧縮（リサイズ＋高品質JPEG）→ ZIPでまとめてダウンロード ──
    btnCompress.addEventListener('click', async () => {
      if (!imageFiles.length) return;
      setBusy(true);
      progressWrap.style.display = 'block';
      errorMsg.textContent = '';

      try {
        if (!window.JSZip) throw new Error('ZIPライブラリを読み込めません。通信状態を確認してください。');
        const zip = new JSZip();
        const usedNames = new Set();

        for (let i = 0; i < imageFiles.length; i++) {
          const file = imageFiles[i];
          progressLabel.textContent = `圧縮中 ${i + 1} / ${imageFiles.length}：${file.name}`;
          progressEl.value = Math.round((i / imageFiles.length) * 100);

          let content = file;
          let name = file.name;
          if (/\.(jpe?g)$/i.test(file.name) || file.type === 'image/jpeg') {
            const candidate = await compressJpeg(await readAsDataURL(file));
            if (candidate.size < file.size) {
              content = candidate;
              name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
            }
          }
          const stem = name.replace(/\.[^.]+$/, '');
          const ext = name.slice(stem.length);
          let n = 1;
          while (usedNames.has(name.toLowerCase())) name = `${stem}_${n++}${ext}`;
          usedNames.add(name.toLowerCase());
          zip.file(name, content);
        }

        progressLabel.textContent = 'ZIPを作成中…';
        const blob = await zip.generateAsync({ type: 'blob' });
        progressEl.value = 100;
        progressLabel.textContent = '完了！ダウンロードを開始します…';
        downloadBlob(blob, safeBaseName() + '_compressed.zip');
      } catch (err) {
        showError('画像圧縮中にエラーが発生しました: ' + err.message);
        console.error(err);
      } finally {
        setBusy(false);
      }
    });

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function readAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function loadImage(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function imageToPng(img) {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      return canvas.toDataURL('image/png');
    }

    async function compressJpeg(dataUrl) {
      const img = await loadImage(dataUrl);
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('JPEG変換に失敗しました')), 'image/jpeg', JPEG_QUALITY);
      });
    }

</script>
</body>
</html>
